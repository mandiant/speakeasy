[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speakeasy-emulator"
dynamic = ["version"]
description = "Speakeasy malware emulation framework"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Andrew Davis"}
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["emulator", "malware", "windows", "reverse-engineering", "security"]
dependencies = [
    "pefile",
    "capstone",
    "lznt1",
    "unicorn>=2.1.4",
    "pycryptodome",
    "pydantic>=2.0",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.17.3",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/mandiant/speakeasy"
Repository = "https://github.com/mandiant/speakeasy"
Issues = "https://github.com/mandiant/speakeasy/issues"

[project.scripts]
speakeasy = "speakeasy.cli:main"

[tool.setuptools.dynamic]
version = {attr = "speakeasy.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["speakeasy*"]

[tool.setuptools.package-data]
speakeasy = [
    "py.typed",
    "resources/**/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["deps/", "tests/capa-testfiles/"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "D",
    "D213",
    "B",
    "T20",
    "PLR0402",
    "PLR1711",
    "PLR5501",
    "RET501",
    "RET502",
    "RET504",
    "RET505",
    "RET508",
    "PIE790",
    "SIM300",
    "SIM114",
    "SIM117",
    "RUF100",
]
# B905 asks for zip(strict=), which adds nothing for most calls here
ignore = ["D1", "D212", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["speakeasy.gdb.ResumeAction"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# RET504: handlers assign the return value to rv before they return it
"speakeasy/winenv/api/**/*.py" = ["D200", "D205", "D402", "D403", "D415", "RET504"]
"{examples,scripts,tests}/**/*.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unreachable = true

[tool.ty.environment]
extra-paths = ["typings"]
